plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    // Keep the code namespace unchanged. The installation identity is separate.
    namespace 'com.msterjime.zikirdua'
    compileSdk 35

    defaultConfig {
        applicationId "com.msterjime.zikirdua.solar"
        minSdk 26
        targetSdk 35
        versionCode 2102
        versionName "2.1.1-solar"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            // Signed outside CI with a private, reusable owner-held key.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
