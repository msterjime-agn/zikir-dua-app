plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {

    namespace 'com.msterjime.zikirdua'
    compileSdk 35

    defaultConfig {
        applicationId "com.msterjime.namazwagty.solar"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 26
        targetSdk 35
        versionCode 2200
        versionName "2.2"
    }

    // Optional release signing, supplied locally. NEVER commit a private keystore.
    if (System.getenv('NAMAZ_KEYSTORE')) {
        signingConfigs {
            standalone {
                storeFile file(System.getenv('NAMAZ_KEYSTORE'))
                storePassword System.getenv('NAMAZ_STORE_PASSWORD')
                keyAlias 'namaz-wagty'
                keyPassword System.getenv('NAMAZ_STORE_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.standalone } }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'

    implementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
