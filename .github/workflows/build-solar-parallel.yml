name: Build Solar parallel install

on:
  push:
    branches: ['fix/solar-parallel-install-20261006']
    paths:
      - '.github/workflows/build-solar-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test calculation engine and build release
        run: gradle clean testDebugUnitTest assembleRelease --stacktrace

      - name: Validate package identity and package sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/signing-tool
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/NAMAZ_WAGTY_2.1.1_Solar_unsigned.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 4 delivery/NAMAZ_WAGTY_2.1.1_Solar_unsigned.apk
          "$BUILD_TOOLS/aapt" dump badging delivery/NAMAZ_WAGTY_2.1.1_Solar_unsigned.apk > delivery/apk-badging.txt
          "$BUILD_TOOLS/aapt" dump xmltree delivery/NAMAZ_WAGTY_2.1.1_Solar_unsigned.apk AndroidManifest.xml > delivery/apk-manifest.txt
          cp "$BUILD_TOOLS/lib/apksigner.jar" delivery/signing-tool/
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import json
          A = '{http://schemas.android.com/apk/res/android}'
          candidates = [p for p in Path('app/build/intermediates/merged_manifests').rglob('AndroidManifest.xml') if 'release' in p.parts]
          assert candidates, 'Release merged manifest not found'
          root = ET.parse(candidates[0]).getroot()
          assert root.attrib['package'] == 'com.msterjime.zikirdua.solar'
          assert A + 'sharedUserId' not in root.attrib
          app = root.find('application')
          assert app.attrib[A + 'label'] == 'NAMAZ WAGTY Solar'
          assert app.attrib.get(A + 'debuggable', 'false') == 'false'
          classes = {e.attrib.get(A+'name', '') for tag in ('activity','service','receiver') for e in app.findall(tag)}
          assert 'com.msterjime.zikirdua.MainActivity' in classes
          assert 'com.msterjime.zikirdua.AzanPlaybackService' in classes
          assert 'com.msterjime.zikirdua.PrayerReminderReceiver' in classes
          assert 'com.msterjime.zikirdua.PrayerBootReceiver' in classes
          authorities = [e.attrib.get(A+'authorities','') for e in app.findall('provider')]
          assert all(a.startswith('com.msterjime.zikirdua.solar.') for a in authorities), authorities
          custom_permissions = [e.attrib[A+'name'] for e in root.findall('permission')]
          assert all(n.startswith('com.msterjime.zikirdua.solar.') for n in custom_permissions), custom_permissions
          results = {'package':root.attrib['package'], 'version':root.attrib.get(A+'versionName'), 'label':app.attrib[A+'label'], 'providers':authorities, 'custom_permissions':custom_permissions, 'components':sorted(classes), 'coexistence_identity_checks':'PASS', 'device_installation_test':'not run'}
          Path('delivery/package-validation.json').write_text(json.dumps(results, indent=2, ensure_ascii=False))
          print(json.dumps(results, indent=2, ensure_ascii=False))
          PY
          git archive --format=zip -o delivery/NAMAZ_WAGTY_2.1.1_Solar_source.zip HEAD
          cp -r app/build/reports/city-solar delivery/calculation-tests
          cp -r app/build/test-results/testDebugUnitTest delivery/unit-tests
          git rev-parse HEAD > delivery/COMMIT.txt
          sha256sum delivery/NAMAZ_WAGTY_2.1.1_Solar_unsigned.apk > delivery/SHA256_unsigned.txt
          printf '%s\n' 'Separate package: com.msterjime.zikirdua.solar. Existing app and data are not replaced.' 'This is the full Solar application with unchanged calculation and dhikr source files.' 'Unsigned release: sign offline with the private reusable Solar key before installation.' 'Do not publish private signing keys or passwords in repository, logs, or public artifacts.' > delivery/README.txt

      - name: Upload build for private signing
        uses: actions/upload-artifact@v4
        with:
          name: solar-parallel-release-unsigned
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solar-parallel-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
