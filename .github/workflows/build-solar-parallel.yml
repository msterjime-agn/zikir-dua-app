name: Build Solar parallel installation

on:
  push:
    branches: ['build/city-solar-20261006']
    paths: ['.github/workflows/build-solar-parallel.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the previously tested Solar source
        uses: actions/checkout@v4
        with:
          ref: aa9d7507f562d94d37a3b5abc8446984f560d535
          persist-credentials: false

      - name: Isolate application identity without changing features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root = Path('app/src')
          code_hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*.kt'))}
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          old = 'applicationId "com.msterjime.zikirdua"'
          assert s.count(old) == 1
          s = s.replace(old, 'applicationId "com.msterjime.zikirdua.solar"')
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode 2002', s, count=1)
          assert n == 1
          s, n = re.subn(r'versionName\s+"[^"]+"', 'versionName "2.1.1-solar-test"', s, count=1)
          assert n == 1
          assert "namespace 'com.msterjime.zikirdua'" in s
          p.write_text(s, encoding='utf-8')
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          old_label = 'android:label="NAMAZ WAGTY Zikir &amp; Dogalar"'
          assert s.count(old_label) == 1
          s = s.replace(old_label, 'android:label="NAMAZ WAGTY Solar"')
          s = s.replace('android:name=".', 'android:name="com.msterjime.zikirdua.')
          p.write_text(s, encoding='utf-8')
          for path, digest in code_hashes.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          Path('installation-source-check.json').write_text(json.dumps(code_hashes, indent=2), encoding='utf-8')
          print('New application ID: com.msterjime.zikirdua.solar')
          print('All Kotlin files, prayer data and calculation logic unchanged.')
          PY
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run regression tests and rebuild complete APK
        run: gradle clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK identity, permissions, components and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          APK=delivery/NAMAZ_WAGTY_Solar_2.1.1_Parallel.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > delivery/signature-verification.txt
          "$TOOLS/aapt" dump badging "$APK" > delivery/apk-metadata.txt
          "$TOOLS/aapt" dump permissions "$APK" > delivery/apk-permissions.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > delivery/merged-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, xml.etree.ElementTree as ET
          metadata = Path('delivery/apk-metadata.txt').read_text()
          permissions = Path('delivery/apk-permissions.txt').read_text()
          manifest = Path('delivery/merged-manifest.txt').read_text()
          assert "package: name='com.msterjime.zikirdua.solar'" in metadata
          assert "versionCode='2002'" in metadata
          assert "application-label:'NAMAZ WAGTY Solar'" in metadata
          assert "launchable-activity: name='com.msterjime.zikirdua.MainActivity'" in metadata
          assert 'com.msterjime.zikirdua.solar.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' in permissions
          assert 'com.msterjime.zikirdua.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' not in permissions
          assert 'com.msterjime.zikirdua.solar.androidx-startup' in manifest
          assert '"com.msterjime.zikirdua.androidx-startup"' not in manifest
          for component in ('MainActivity', 'AzanPlaybackService', 'PrayerReminderReceiver', 'PrayerBootReceiver'):
              assert 'com.msterjime.zikirdua.' + component in manifest
          with zipfile.ZipFile('delivery/NAMAZ_WAGTY_Solar_2.1.1_Parallel.apk') as z:
              assert z.testzip() is None
          totals = [0, 0, 0]
          for report in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              e = ET.parse(report).getroot()
              for i, key in enumerate(('tests', 'failures', 'errors')):
                  totals[i] += int(e.attrib.get(key, 0))
          assert totals[0] >= 8 and totals[1:] == [0, 0], totals
          Path('delivery/verification.txt').write_text(
              'Package: com.msterjime.zikirdua.solar\nVersion: 2.1.1-solar-test (2002)\n'
              'Application label: NAMAZ WAGTY Solar\n'
              'Kotlin application code and calculation data unchanged from the tested 2.1 Solar source.\n'
              'Source commit: aa9d7507f562d94d37a3b5abc8446984f560d535 plus installation-identity.patch\n'
              f'JUnit tests: {totals[0]}, failures: {totals[1]}, errors: {totals[2]}\n'
              'APK ZIP integrity, v2 signature, application ID, launcher, permissions and provider authority verified.\n'
              'Separate test installation, not an in-place update. Does not import data from the old application.\n'
              'No installation test on a physical device was performed in this build.\n', encoding='utf-8')
          PY
          git diff -- app/build.gradle app/src/main/AndroidManifest.xml > delivery/installation-identity.patch
          cp installation-source-check.json delivery/
          cp -r app/build/test-results/testDebugUnitTest delivery/unit-tests
          cp -r app/build/reports/city-solar delivery/calculation-tests
          sha256sum "$APK" > delivery/SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('delivery/NAMAZ_WAGTY_Solar_2.1.1_source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for p in sorted(Path('.').rglob('*')):
                  if not p.is_file() or any(x in p.parts for x in ('.git', '.gradle', 'build', 'delivery')):
                      continue
                  if p.suffix in ('.jks', '.keystore') or p.name == 'local.properties':
                      continue
                  out.write(p, str(p))
          PY

      - name: Upload isolated application and verification
        uses: actions/upload-artifact@v4
        with:
          name: namaz-wagty-solar-parallel-2002
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics if necessary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solar-parallel-diagnostics
          path: |
            delivery/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
