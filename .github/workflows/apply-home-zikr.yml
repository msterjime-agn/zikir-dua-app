name: Apply Home Zikr patch

on:
  push:
    paths:
      - '.github/workflows/apply-home-zikr.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Combine home dhikr shortcuts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/msterjime/zikirdua/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        item { QuickAction("☀", text.morningDhikr, text.morningAfter, onDhikr) }
        item { QuickAction("☽", text.eveningDhikr, text.eveningAfter, onDhikr) }
'''
          new = '''        item { QuickAction("✦", text.dhikr, text.dhikrDuaTitle, onDhikr) }
'''
          if old not in text:
              raise SystemExit('Expected home dhikr shortcut block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit home Zikr change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/msterjime/zikirdua/MainActivity.kt
          git commit -m "Combine home dhikr shortcuts into one Zikr card"
          git push
