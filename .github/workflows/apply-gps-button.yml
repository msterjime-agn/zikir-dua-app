name: Apply GPS button patch

on:
  push:
    paths:
      - '.github/workflows/apply-gps-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add manual GPS button to home card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/msterjime/zikirdua/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          if 'Text("◎ GPS"' in text:
              print('GPS button already exists')
          else:
              marker = '''                    Spacer(Modifier.height(12.dp))
                    Text(text.nextPrayer, color = Color.White.copy(alpha = 0.78f), fontSize = 14.sp)
              '''
              marker = marker[:-14]
              replacement = '''                    Spacer(Modifier.height(6.dp))
                    Button(
                        onClick = onAutoLocation,
                        colors = ButtonDefaults.buttonColors(containerColor = Gold, contentColor = DeepGreen)
                    ) {
                        Text("◎ GPS", fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                    }
                    Spacer(Modifier.height(12.dp))
                    Text(text.nextPrayer, color = Color.White.copy(alpha = 0.78f), fontSize = 14.sp)
'''
              if marker not in text:
                  marker = '                    Spacer(Modifier.height(12.dp))\n                    Text(text.nextPrayer, color = Color.White.copy(alpha = 0.78f), fontSize = 14.sp)\n'
              if marker not in text:
                  raise SystemExit('Home prayer marker not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit GPS button
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/msterjime/zikirdua/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add manual GPS auto-detect button"
            git push
          fi
