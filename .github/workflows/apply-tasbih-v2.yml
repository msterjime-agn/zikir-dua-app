name: Apply Tasbih v2 patch

on:
  push:
    paths:
      - '.github/workflows/apply-tasbih-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add manual GPS auto-detect button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/msterjime/zikirdua/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          if 'Text("GPS",' not in text:
              needle = '                    Text(text.nextPrayer, color = Color.White.copy(alpha = 0.78f), fontSize = 14.sp)'
              if needle not in text:
                  raise SystemExit('nextPrayer line not found')
              block = (
                  '                    Button(\n'
                  '                        onClick = onAutoLocation,\n'
                  '                        colors = ButtonDefaults.buttonColors(containerColor = Gold, contentColor = DeepGreen)\n'
                  '                    ) {\n'
                  '                        Text("GPS", fontSize = 12.sp, fontWeight = FontWeight.SemiBold)\n'
                  '                    }\n'
                  '                    Spacer(Modifier.height(8.dp))\n'
              )
              text = text.replace(needle, block + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit GPS button
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/msterjime/zikirdua/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add manual GPS auto-detect button"
            git push
          fi
