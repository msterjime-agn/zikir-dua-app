          if '🔔 Namaz ýatlatmasy' not in text:
              text = text[:note_pos] + reminder_ui + text[note_pos:]

          main.write_text(text, encoding='utf-8')

          reminder = Path('app/src/main/java/com/msterjime/zikirdua/PrayerReminder.kt')
          reminder.write_text(r'''package com.msterjime.zikirdua

import android.Manifest
import android.app.AlarmManager
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.os.Build
import androidx.core.app.NotificationCompat
import androidx.core.app.NotificationManagerCompat
import java.time.LocalDate
import java.time.LocalTime
import java.time.ZoneOffset
import java.time.ZonedDateTime

internal data class PrayerReminderDay(
    val date: LocalDate,
    val prayers: List<Pair<String, LocalTime>>
)

private const val ReminderChannelId = "prayer_reminders"
private const val ReminderPrefs = "prayer_reminder_schedule"
private const val ReminderCodesKey = "request_codes"
private val ReminderZone = ZoneOffset.ofHours(5)

internal fun cancelPrayerReminders(context: Context) {
    val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
    val prefs = context.getSharedPreferences(ReminderPrefs, Context.MODE_PRIVATE)
    val codes = prefs.getString(ReminderCodesKey, "").orEmpty()
        .split(',')
        .mapNotNull { it.toIntOrNull() }

    codes.forEach { code ->
        val intent = Intent(context, PrayerReminderReceiver::class.java)
        val pendingIntent = PendingIntent.getBroadcast(
            context,
            code,
            intent,
            PendingIntent.FLAG_NO_CREATE or PendingIntent.FLAG_IMMUTABLE
        )
        if (pendingIntent != null) {
            alarmManager.cancel(pendingIntent)
            pendingIntent.cancel()
        }
    }
    prefs.edit().remove(ReminderCodesKey).apply()
}

internal fun schedulePrayerReminders(
    context: Context,
    days: List<PrayerReminderDay>,
    minutesBefore: Int,
    languageCode: String,
    cityName: String
) {
    cancelPrayerReminders(context)
    if (minutesBefore < 0) return

    val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
    val now = ZonedDateTime.now(ReminderZone)
    val requestCodes = mutableListOf<Int>()

    days.forEach { day ->
        day.prayers.forEachIndexed { prayerIndex, prayer ->
            val prayerName = prayer.first
            val prayerTime = prayer.second
            val trigger = ZonedDateTime.of(day.date, prayerTime, ReminderZone)
                .minusMinutes(minutesBefore.toLong())
            if (!trigger.isAfter(now)) return@forEachIndexed

            val code = ((day.date.toEpochDay() % 100000L) * 10L + prayerIndex).toInt()
            val intent = Intent(context, PrayerReminderReceiver::class.java).apply {
                putExtra("request_code", code)
                putExtra("prayer_name", prayerName)
                putExtra("city_name", cityName)
                putExtra("minutes_before", minutesBefore)
                putExtra("language_code", languageCode)
            }
            val pendingIntent = PendingIntent.getBroadcast(
                context,
                code,
                intent,
                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
            )

            alarmManager.setAndAllowWhileIdle(
                AlarmManager.RTC_WAKEUP,
                trigger.toInstant().toEpochMilli(),
                pendingIntent
            )
            requestCodes += code
        }
    }

    context.getSharedPreferences(ReminderPrefs, Context.MODE_PRIVATE)
        .edit()
        .putString(ReminderCodesKey, requestCodes.joinToString(","))
        .apply()
}

class PrayerReminderReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        if (
            Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
            context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
        ) return

        createReminderChannel(context)

        val code = intent.getIntExtra("request_code", 1001)
        val prayerName = intent.getStringExtra("prayer_name").orEmpty()
        val cityName = intent.getStringExtra("city_name").orEmpty()
        val minutesBefore = intent.getIntExtra("minutes_before", 0)
        val languageCode = intent.getStringExtra("language_code") ?: "tm"

        val title = when (languageCode) {
            "ru" -> "Время намаза"
            "en" -> "Prayer time"
            "tr" -> "Namaz vakti"
            else -> "Namaz wagty"
        }
        val message = when (languageCode) {
            "ru" -> if (minutesBefore > 0) "$prayerName через $minutesBefore мин. • $cityName" else "$prayerName • $cityName"
            "en" -> if (minutesBefore > 0) "$prayerName in $minutesBefore min • $cityName" else "$prayerName • $cityName"
            "tr" -> if (minutesBefore > 0) "$prayerName için $minutesBefore dk kaldı • $cityName" else "$prayerName • $cityName"
            else -> if (minutesBefore > 0) "$prayerName wagtyna $minutesBefore minut galdy • $cityName" else "$prayerName • $cityName"
        }

        val openIntent = Intent(context, MainActivity::class.java).apply {
            flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
        }
        val openPendingIntent = PendingIntent.getActivity(
            context,
            code,
            openIntent,
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )

        val notification = NotificationCompat.Builder(context, ReminderChannelId)
            .setSmallIcon(R.drawable.ic_launcher)
            .setContentTitle(title)
            .setContentText(message)
            .setStyle(NotificationCompat.BigTextStyle().bigText(message))
            .setPriority(NotificationCompat.PRIORITY_HIGH)
            .setCategory(NotificationCompat.CATEGORY_ALARM)
            .setAutoCancel(true)
            .setContentIntent(openPendingIntent)
            .setDefaults(NotificationCompat.DEFAULT_ALL)
            .build()

        NotificationManagerCompat.from(context).notify(code, notification)
    }
}

private fun createReminderChannel(context: Context) {
    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
        val channel = NotificationChannel(
            ReminderChannelId,
            "Namaz reminders",
            NotificationManager.IMPORTANCE_HIGH
        ).apply {
            description = "Prayer time reminders"
            enableVibration(true)
        }
        val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
        manager.createNotificationChannel(channel)
    }
}
''', encoding='utf-8')

