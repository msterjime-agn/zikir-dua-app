name: Apply prayer reminder patch

on:
  push:
    paths:
      - '.github/workflows/apply-prayer-reminders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add prayer reminder notifications
        shell: bash
        run: python -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: Commit reminder changes
        shell: bash
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add app/src/main/java/com/msterjime/zikirdua/MainActivity.kt app/src/main/java/com/msterjime/zikirdua/PrayerReminder.kt app/src/main/AndroidManifest.xml && git commit -m "Add configurable prayer reminders" && git push
