name: Apply reminder UI v2

on:
  push:
    paths:
      - '.github/workflows/apply-reminder-ui-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect reminder UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/msterjime/zikirdua/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          visibility_changes = [
              ('private data class City(', 'internal data class City('),
              ('private val Cities = listOf(', 'internal val Cities = listOf('),
              ('private data class PrayerTimes(', 'internal data class PrayerTimes('),
              ('private fun calculatePrayerTimes(', 'internal fun calculatePrayerTimes('),
              ('private enum class AppLanguage(', 'internal enum class AppLanguage('),
              ('private data class PrayerLabels(', 'internal data class PrayerLabels('),
              ('private fun prayerLabels(', 'internal fun prayerLabels('),
          ]
          for old, new in visibility_changes:
              if old in text:
                  text = text.replace(old, new, 1)

          text = text.replace(
              'counter = "Hasaplaýjy 33 / 100",',
              'counter = "Hasaplaýjy • 7 / 11 / 33 / 100 / 1000 / ∞",'
          )
          text = text.replace(
              'counter = "Счётчик 33 / 100",',
              'counter = "Счётчик • 7 / 11 / 33 / 100 / 1000 / ∞",'
          )
          text = text.replace(
              'counter = "Counter 33 / 100",',
              'counter = "Counter • 7 / 11 / 33 / 100 / 1000 / ∞",'
          )
          text = text.replace(
              'counter = "Sayaç 33 / 100",',
              'counter = "Sayaç • 7 / 11 / 33 / 100 / 1000 / ∞",'
          )

          if 'PrayerReminderCard(' not in text:
              marker = (
                  '        item {\n'
                  '            Card(\n'
                  '                Modifier.fillMaxWidth(),\n'
                  '                colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF5D9)),\n'
              )
              reminder_card = (
                  '        item {\n'
                  '            PrayerReminderCard(\n'
                  '                city = city,\n'
                  '                labels = labels,\n'
                  '                languageCode = language.code\n'
                  '            )\n'
                  '        }\n'
              )
              prayer_screen = text.index('@Composable\nprivate fun PrayerScreen(')
              marker_pos = text.find(marker, prayer_screen)
              if marker_pos < 0:
                  raise SystemExit('Prayer reminder insertion point not found')
              text = text[:marker_pos] + reminder_card + text[marker_pos:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit reminder UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/msterjime/zikirdua/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect prayer reminder controls"
            git push
          fi
