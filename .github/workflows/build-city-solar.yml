name: Build city solar APK

on:
  push:
    branches: ['build/city-solar-20261006']
    paths:
      - '.github/workflows/build-city-solar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete application
        uses: actions/checkout@v4
        with:
          ref: build/city-solar-20261006

      - name: Integrate and validate source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_city_solar.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r'Base64\.DEFAULT', r'Base64\.(?:DEFAULT|NO_WRAP)')
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/integrate_city_solar.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts/integrate_city_solar.py
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate regional sunrise/sunset city corrections and preserve existing application features'
            git push origin HEAD:build/city-solar-20261006
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test calculations and build complete APK
        run: gradle clean testDebugUnitTest assembleDebug --stacktrace

      - name: Package APK and reproducible sources
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/NAMAZ_WAGTY_2.1_Solar.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs delivery/NAMAZ_WAGTY_2.1_Solar.apk > delivery/signature-verification.txt
          git archive --format=zip -o delivery/NAMAZ_WAGTY_2.1_Solar_source.zip HEAD
          cp -r app/build/reports/city-solar delivery/calculation-tests
          cp -r app/build/test-results/testDebugUnitTest delivery/unit-tests
          git rev-parse HEAD > delivery/COMMIT.txt
          sha256sum delivery/NAMAZ_WAGTY_2.1_Solar.apk > delivery/SHA256.txt
          printf '%s\n' 'Full application rebuilt from the current repository.' 'City corrections use separate local sunrise and sunset differences relative to explicit assumed regional anchors.' 'Oyle stays fixed: 13:30, Balkan 13:40. Source table bytes preserved.' 'The city-adjusted schedule is a model, not an officially approved local calendar. Ertir is not a verified fasting boundary.' 'Flagged source rows are displayed with a warning; alerts for flagged times are not scheduled.' 'Existing prayer mode and personal settings are preserved. Select Sunrise / sunset in settings to use the city-adjusted mode.' 'Debug APK: installation over a previous APK requires the same signing certificate. Do not uninstall an existing app before saving personal data.' > delivery/README.txt

      - name: Upload complete APK package
        uses: actions/upload-artifact@v4
        with:
          name: namaz-wagty-2.1-solar
          path: delivery/
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: city-solar-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            app/src/main/java/com/msterjime/zikirdua/CitySolarSchedule.kt
          if-no-files-found: warn
